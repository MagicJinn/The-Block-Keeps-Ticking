# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.3.0
group=magicjinn.theblockkeepsticking
java_version=25

# Common
minecraft_version=26.3
mod_name=The Block Keeps Ticking
mod_author=MagicJinn
# NeoForge forbids hyphens in modIds. Fabric publishes under fabric_mod_id for continuity.
mod_id=the_block_keeps_ticking
fabric_mod_id=the-block-keeps-ticking
license=MIT
credits=
description=Simulates block ticking and entity growth in unloaded chunks, so your farms, furnaces, and passive mobs keep growing and working even when you're far away.\n\nMod icon by Sulmino_ on Twitter/X
