fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)

# Dependencies
yacl_version_fabric=3.9.7+26.3-fabric
yacl_version_neoforge=3.9.7+26.3-neoforge
modmenu_version=21.0.0-beta.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
